<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/src/styles/tokens.css">
</head><body style="margin:0;background:#888">
<canvas id="c" width="1200" height="630"></canvas>
<script type="module">
// OG 이미지 만들기: 개발 서버에서 /scripts/og.html 을 열면 public/og.png 저장
await Promise.all([document.fonts.load('800 60px NanumSquareNeo'), document.fonts.load('400 20px NanumSquareNeo')]);
const c = document.getElementById('c'), x = c.getContext('2d');
x.fillStyle = '#efe7d8'; x.fillRect(0, 0, 1200, 630);
x.strokeStyle = '#26211c'; x.lineWidth = 2; x.strokeRect(28, 28, 1144, 574);
x.fillStyle = '#8f8475'; x.font = '400 22px NanumSquareNeo'; x.fillText('되풀이사주 · RECURRING SAJU', 72, 98);
x.beginPath(); x.moveTo(72, 120); x.lineTo(1128, 120); x.stroke();
x.fillStyle = '#26211c'; x.font = '800 70px NanumSquareNeo'; x.letterSpacing = '-4.8px';
["'또 이러네'가", '몇 번째인지'].forEach((t, i) => x.fillText(t, 72, 236 + i * 88));
x.fillStyle = '#c2412b'; x.fillRect(72, 380, 110, 8);
x.fillStyle = '#574e44'; x.font = '400 26px NanumSquareNeo'; x.letterSpacing = '-1.8px';
x.fillText('대운 · 세운으로 짚는 되풀이된 해 · 생각 버릇 · 대처', 72, 460);
x.fillStyle = '#8f8475'; x.font = '400 22px NanumSquareNeo'; x.letterSpacing = '0px'; x.fillText('01–03 FREE · 04–09 ₩13,900', 72, 520);
// 오른쪽: 연도 격자
x.strokeStyle = '#cdbfa8'; x.lineWidth = 1;
const ys = ['2011', '2015', '2019', '2023'];
ys.forEach((y, i) => { const yy = 200 + i * 86; x.beginPath(); x.moveTo(760, yy + 22); x.lineTo(1128, yy + 22); x.stroke(); x.fillStyle = i === 3 ? '#c2412b' : '#26211c'; x.font = '800 54px NanumSquareNeo'; x.letterSpacing = '-3px'; x.fillText(y, 760, yy); });
x.fillStyle = '#8f8475'; x.font = '400 18px NanumSquareNeo'; x.letterSpacing = '0px'; x.fillText('같은 장면이 돌아온 해', 960, 560);
const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
await fetch('/__save-og', { method: 'POST', body: blob });
document.title = 'saved';
</script></body></html>
