<script>
/* 배포 직후 브라우저에 남은 예전 HTML 이 지워진 스크립트·스타일을 찾다 실패하면, 캐시를 피해 한 번만 새로 불러온다 */
addEventListener('error',function(e){var t=e.target;if(!t||!(t.tagName==='SCRIPT'||t.tagName==='LINK'))return;var u=t.src||t.href||'';if(u.indexOf('/assets/')<0)return;try{if(sessionStorage.getItem('zoosa2.reloaded'))return;sessionStorage.setItem('zoosa2.reloaded','1')}catch(_){}var l=location;l.replace(l.pathname+(l.search?l.search+'&':'?')+'r='+Date.now()+l.hash)},true);
addEventListener('load',function(){try{sessionStorage.removeItem('zoosa2.reloaded')}catch(_){}});
</script>
